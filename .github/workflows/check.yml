name: Check

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # Tag pushes also match the `tags: [v*]` trigger above (so that
  # release.yml's check-passed gate has something to find), which would
  # otherwise re-run the full check every time an already-checked commit
  # on main gets tagged. Skip that redundant run when a successful check
  # already exists for the commit; push-to-main and pull_request runs
  # are unaffected (this job only runs for tag pushes).
  check-already-passed:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.query.outputs.skip }}
    steps:
      - name: Look for an existing successful check run on this commit
        id: query
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          COUNT=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=check.yml \
            --commit="$SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq 'length')
          if [ "$COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: [check-already-passed]
    if: always() && needs.check-already-passed.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential chezscheme uuid-dev libtls-dev
          sudo ln -sf /usr/bin/chezscheme /usr/local/bin/scheme

      - name: Get month
        id: date
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache letloop toolchain (chezscheme + letloop + FFI deps)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: submodules/letloop/local/
          key: letloop-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.month }}
          restore-keys: |
            letloop-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Chez Scheme
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: make -C submodules/letloop chezscheme SCHEME=$(which scheme)

      - name: Build letloop
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: make -C submodules/letloop letloop SCHEME=$(pwd)/submodules/letloop/local/bin/scheme

      - name: Build FFI dependencies
        run: make -C submodules/letloop dependencies

      - name: Compile bb
        run: LD_LIBRARY_PATH=$(pwd)/submodules/letloop/local/lib/ submodules/letloop/local/bin/letloop compile --visible-libraries src/ src/bb/cli.scm main

      - name: Verify
        run: |
          LD_LIBRARY_PATH=$(pwd)/submodules/letloop/local/lib/ ./a.out --version
          LD_LIBRARY_PATH=$(pwd)/submodules/letloop/local/lib/ ./a.out eval '(+ 1 2)'
