name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check-passed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - name: Verify Check workflow passed on this commit
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          RESULT=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=check.yml \
            --commit="$SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq 'length')
          if [ "$RESULT" = "1" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Check workflow did not pass on commit $SHA"
            exit 1
          fi

  build:
    needs: check-passed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential chezscheme uuid-dev libtls-dev patchelf bubblewrap
          sudo ln -sf /usr/bin/chezscheme /usr/local/bin/scheme

      - name: Get month
        id: date
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache letloop toolchain (chezscheme + letloop + FFI deps)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: submodules/letloop/local/
          key: letloop-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.month }}
          restore-keys: |
            letloop-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build relocatable release tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: make tarball

      - name: Allow unprivileged user namespaces (bwrap needs this on 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Acceptance test (extract to an arbitrary path, no system liburing/libtls)
        run: make tarball-check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-${{ github.ref_name }}-x86_64-linux
          path: |
            bb-${{ github.ref_name }}-x86_64-linux.tar.gz
            bb-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/bb-${{ github.ref_name }}-x86_64-linux.tar.gz
            artifacts/bb-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256
