name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check-passed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - name: Verify Check workflow passed on this commit
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          RESULT=$(gh run list \
            --workflow=check.yml \
            --commit="$SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq 'length')
          if [ "$RESULT" = "1" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Check workflow did not pass on commit $SHA"
            exit 1
          fi

  build:
    needs: check-passed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential chezscheme uuid-dev liburing2
          sudo ln -sf /usr/bin/chezscheme /usr/local/bin/scheme

      - name: Get month
        id: date
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Chez Scheme build
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: submodules/letloop/local/
          key: chezscheme-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.month }}
          restore-keys: |
            chezscheme-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Chez Scheme
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: make -C submodules/letloop chezscheme SCHEME=$(which scheme)

      - name: Build letloop
        run: make -C submodules/letloop letloop SCHEME=$(pwd)/submodules/letloop/local/bin/scheme

      - name: Compile bb
        run: submodules/letloop/local/bin/letloop compile --visible-libraries src/ src/bb/cli.scm main

      - name: Verify
        run: |
          ./a.out --version
          ./a.out eval '(+ 1 2)'

      - name: Package
        run: |
          cp a.out bb-linux-amd64
          sha256sum bb-linux-amd64 > bb-linux-amd64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-linux-amd64
          path: |
            bb-linux-amd64
            bb-linux-amd64.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/bb-linux-amd64
            artifacts/bb-linux-amd64.sha256
